name: Actualizar Feed XML

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm install @supabase/supabase-js

      - name: Generar feed.xml
        run: node generate-feed.js
        env:
          SUPABASE_URL: https://iwbjzffwpijbeqyavtkd.supabase.co
          SUPABASE_KEY: sb_publishable_6tONcb7KYIxWPyIW5OTP7w_pZuXiUzu

      - name: Subir feed.xml actualizado
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "Feed actualizado automáticamente"
          git push
